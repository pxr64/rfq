[package]
name = "maker-node"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "colorex"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
dirs = "5"
hex = "0.4"
humantime-serde = "1"
rand = "0.8"
rfq-btc = { path = "../rfq-btc", features = ["electrum"] }
rfq-client = { path = "../rfq-client" }
rfq-maker = { path = "../rfq-maker" }
rfq-rgb = { path = "../rfq-rgb" }
rfq-router = { path = "../rfq-router" }
rfq-store = { path = "../rfq-store" }
rfq-types = { path = "../rfq-types" }
rfq-wallet = { path = "../rfq-wallet" }
secp256k1 = { version = "0.30", features = ["rand", "global-context"] }
serde.workspace = true
shellexpand = "3"
tokio.workspace = true
toml = "0.8"

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true
# Pull in rfq-rgb's e2e harness for the regtest HTTP integration test.
rfq-rgb = { path = "../rfq-rgb", features = ["test-helpers"] }
# Lib-side PSBT primitives the HTTP test uses to drive taker signing.
bp-std = { version = "=0.11.1-alpha.2", features = ["client-side-validation", "serde", "signers"] }
bp-wallet = { version = "=0.11.1-alpha.2", features = ["fs", "signers", "electrum"] }
# Reach into the maker_app via HTTP in the regtest integration test.
reqwest.workspace = true
# Spin up the broker in-process for the broker_round_trip test.
rfq-api = { path = "../rfq-api" }
