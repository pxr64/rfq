[package]
name = "rfq-rgb"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
rfq-btc = { path = "../rfq-btc" }
rfq-types = { path = "../rfq-types" }
thiserror.workspace = true
base64 = "0.22"

# Library-backed RGB adapter. Pinned to the same versions rgb-cmd 0.11.1-rc.6 uses;
# see docs/regtest-rgb20-nia-dev-infra.md "Known Constraints & Version Pins".
rgb-api = { version = "=0.11.1-rc.6", features = ["electrum_blocking", "fs", "serde"] }
# `signers` exposes bp-std's `TestnetRefSigner` and bp-wallet's `hot` module
# (`SecureIo` / `XprivAccount::read`) for the cold/hot signer split the swap
# PSBT methods need — see docs/swap-psbt-design.md U6.
bp-std = { version = "=0.11.1-alpha.2", features = ["client-side-validation", "serde", "signers"] }
bp-wallet = { version = "=0.11.1-alpha.2", features = ["fs", "signers"] }
amplify = "=4.8.0"

[dev-dependencies]
tokio = { workspace = true }
