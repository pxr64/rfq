[package]
name = "rfq-rgb"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Default-on so rfq-rgb's own integration tests and dependent crates'
# tests can both reach `rfq_rgb::test_helpers::RegtestStack` without
# extra feature flagging. Production consumers can opt out with
# `default-features = false` to skip the tempfile + tokio pull-ins.
default = ["test-helpers"]
# Exposes `rfq_rgb::test_helpers::RegtestStack` (the e2e harness) as a
# library module so downstream crates' integration tests can reuse it
# without duplicating the bootstrap. Brings in `tempfile` + `tokio` as
# runtime deps when enabled.
test-helpers = ["dep:tempfile", "dep:tokio"]

[dependencies]
async-trait.workspace = true
rfq-btc = { path = "../rfq-btc", features = ["electrum"] }
rfq-consignment = { path = "../rfq-consignment" }
rfq-types = { path = "../rfq-types" }
thiserror.workspace = true
base64 = "0.22"

# Library-backed RGB adapter. Pinned to the same versions rgb-cmd 0.11.1-rc.6 uses;
# see docs/regtest-rgb20-nia-dev-infra.md "Known Constraints & Version Pins".
rgb-api = { version = "=0.11.1-rc.6", features = ["electrum_blocking", "fs", "serde"] }
bp-std = { version = "=0.11.1-alpha.2", features = ["client-side-validation", "serde", "signers"] }
bp-wallet = { version = "=0.11.1-alpha.2", features = ["fs", "signers", "electrum"] }
bp-electrum = "=0.11.1-alpha.2"
rgb-psbt-utils = "=0.11.1-rc.6"
amplify = "=4.8.0"
rand = "0.9"

# Optional deps only pulled in when the `test-helpers` feature is on.
tempfile = { version = "3", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
