services:
  bitcoind:
    image: bitcoin/bitcoin:31.0
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.00001000
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      # No -rpcuser/-rpcpassword: bitcoind auto-generates a .cookie file in the
      # data dir, which the electrs container reads via the shared volume mount
      # below. romanz/electrs 0.11.1 only supports --cookie-file auth, not
      # --cookie=user:pass.
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    ports:
      - "18443:18443"
      - "18444:18444"
      - "28332:28332"
      - "28333:28333"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test:
        [
          "CMD",
          "bitcoin-cli",
          "-regtest",
          "-datadir=/home/bitcoin/.bitcoin",
          "getblockchaininfo",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  electrs:
    build:
      context: .
      dockerfile: electrs.Dockerfile
    image: rgb-rfq/electrs:0.11.1
    # romanz/electrs built from source. bp-wallet 0.11.1-alpha.2's electrum
    # parser only handles the romanz response shape; blockstream-fork
    # derivatives (mempool/electrs, getumbrel/electrs) trip
    # `expect("broken logic")` at bp-wallet/src/indexers/electrum.rs:220.
    depends_on:
      bitcoind:
        condition: service_healthy
    entrypoint: electrs
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --daemon-p2p-addr=bitcoind:18444
      - --daemon-dir=/home/bitcoin/.bitcoin
      - --cookie-file=/home/bitcoin/.bitcoin/regtest/.cookie
      - --electrum-rpc-addr=0.0.0.0:50001
      - --db-dir=/data
      - --log-filters=INFO
    ports:
      - "50001:50001"
    volumes:
      - electrs-data:/data
      # Read-only share of bitcoind's data dir so electrs can read .cookie.
      - bitcoind-data:/home/bitcoin/.bitcoin:ro

volumes:
  bitcoind-data:
  electrs-data:
