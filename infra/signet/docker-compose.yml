services:
  bitcoind:
    image: bitcoin/bitcoin:31.0
    restart: unless-stopped
    command:
      - -signet=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.00001000
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      # No -rpcuser/-rpcpassword: bitcoind auto-generates a .cookie file that the
      # electrs container reads via the shared volume mount (romanz/electrs only
      # supports --cookie-file auth).
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    ports:
      # Default public-signet ports (38332/38333); free on this host (regtest
      # stack uses 19443/19444, the stale satoma stack uses 18443).
      - "38332:38332"
      - "38333:38333"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test:
        [
          "CMD",
          "bitcoin-cli",
          "-signet",
          "-datadir=/home/bitcoin/.bitcoin",
          "getblockchaininfo",
        ]
      interval: 10s
      timeout: 10s
      retries: 60

  electrs:
    # Reuse the romanz/electrs 0.11.1 image the regtest stack builds. romanz (not
    # the blockstream/mempool fork) is REQUIRED: bp-wallet + the rgb-ops resolver
    # both need verbose `blockchain.transaction.get`, which the fork (e.g.
    # mempool.space) rejects -> bp-wallet's `expect("broken logic")` panic.
    build:
      context: ../regtest
      dockerfile: electrs.Dockerfile
    image: rgb-rfq/electrs:0.11.1
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_healthy
    entrypoint: electrs
    command:
      - --network=signet
      - --daemon-rpc-addr=bitcoind:38332
      - --daemon-p2p-addr=bitcoind:38333
      - --daemon-dir=/home/bitcoin/.bitcoin
      - --cookie-file=/home/bitcoin/.bitcoin/signet/.cookie
      - --electrum-rpc-addr=0.0.0.0:50001
      - --db-dir=/data
      - --log-filters=INFO
    ports:
      # Host electrum port shifted off 60001 (regtest) -> 60601 for signet.
      - "60601:50001"
    volumes:
      - electrs-data:/data
      - bitcoind-data:/home/bitcoin/.bitcoin:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    ports:
      # 5433 on the host to avoid colliding with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 5s
      timeout: 5s
      retries: 20

  broker:
    build:
      # Repo root — the broker image compiles the whole workspace (see
      # infra/broker.Dockerfile + the root .dockerignore).
      context: ../..
      dockerfile: infra/broker.Dockerfile
    image: rgb-rfq/broker:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      electrs:
        # electrs has no healthcheck; a missed electrum connect only disables the
        # confirmation loop (non-fatal), so service_started is enough.
        condition: service_started
    environment:
      BROKER_LISTEN: 0.0.0.0:3000
      BROKER_DATABASE_URL: postgres://broker:broker@postgres:5432/broker
      # electrs's in-container electrum port (50001); host sees it on 60601.
      BROKER_ELECTRUM_URL: tcp://electrs:50001
      BROKER_CONFIRMATIONS: "1"
    ports:
      # Makers (host processes) dial ws://localhost:3000/maker-stream; the dapp
      # hits the same host:3000 for the HTTP API.
      - "3000:3000"

  cloudflared:
    # Token-based ("remotely-managed") tunnel: publishes rfq-signet.colorex.io
    # over HTTPS with no inbound ports. Create the tunnel in the Cloudflare
    # Zero Trust dashboard (Networks -> Tunnels), add a Public Hostname
    #   rfq-signet.colorex.io  ->  http://broker:3000
    # ("broker" resolves on this compose network), then put the tunnel token in
    # infra/signet/.env as CLOUDFLARE_TUNNEL_TOKEN.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in infra/signet/.env}
    depends_on:
      broker:
        condition: service_started

volumes:
  bitcoind-data:
  electrs-data:
  postgres-data:
