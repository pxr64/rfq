[workspace]
members = [
    "crates/rfq-types",
    "crates/rfq-core",
    "crates/rfq-router",
    "crates/rfq-rgb",
    "crates/rfq-btc",
    "crates/rfq-api",
    "crates/rfq-maker",
    "crates/rfq-store",
    "crates/rfq-client",
    "crates/rfq-wallet",
    "crates/maker-node",
    "crates/wallet-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "0.2"
